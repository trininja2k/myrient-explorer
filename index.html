<!doctype html>
<html>
  <head>
    <title>Myrient Explorer Pro (KB/Bits)</title>
    <script src="https://code.jquery.com/jquery-3.7.0.js"></script>
    <script src="https://cdn.datatables.net/1.13.7/js/jquery.dataTables.min.js"></script>
    <link
      rel="stylesheet"
      href="https://cdn.datatables.net/1.13.7/css/jquery.dataTables.min.css"
    />
    <style>
      body {
        background: #1a1a1a;
        color: #fff;
        padding: 20px;
        font-family: monospace;
      }
      #table {
        width: 100% !important;
      }
      th {
        background: #333;
      }
    </style>
  </head>
  <body>
    <h1>Myrient Explorer (66k Ordner + KB/Bits)</h1>
    <table id="table" class="display">
      <thead>
        <tr>
          <th>Folder</th>
          <th>Size GB</th>
          <th>Size KB</th>
          <th>Bits (GB)</th>
          <th>Files</th>
          <th>URL</th>
          <th>Raw Bytes GB</th>
        </tr>
      </thead>
    </table>
    <script>
      $(document).ready(function () {
        $("#table").DataTable({
          ajax: { url: "myrient-enhanced.json", dataSrc: "" },
          columns: [
            { data: "Folder" },
            { data: "Size_GB", render: (d) => d.toLocaleString() + " GB" },
            {
              data: "Size_KB",
              render: (d) => Math.round((d / 1024 ** 2) * 100) / 100 + " GB",
            },
            {
              data: "Size_Bits",
              render: (d) => (d / 8 / 1024 ** 3).toFixed(2) + " GB",
            },
            { data: "Files", render: (d) => d.toLocaleString() },
            {
              data: "URL",
              render: (v) => `<a href="${v}" target="_blank">Open</a>`,
            },
            {
              data: "recursive_bytes",
              render: (d) => (d / 1024 ** 3).toFixed(2) + " GB",
            },
          ],
          pageLength: 50,
          order: [[1, "desc"]],
          paging: true,
          searching: true,
        });
      });
    </script>
  </body>
</html>
