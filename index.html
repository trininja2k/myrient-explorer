<!doctype html>
<html>
  <head>
    <title>Myrient Explorer Pro (KB/Bits)</title>
    <script src="https://code.jquery.com/jquery-3.7.0.js"></script>
    <script src="https://cdn.datatables.net/1.13.7/js/jquery.dataTables.min.js"></script>
    <link
      rel="stylesheet"
      href="https://cdn.datatables.net/1.13.7/css/jquery.dataTables.min.css"
    />
    <style>
      body {
        background: #1a1a1a;
        color: #fff;
        padding: 20px;
        font-family: monospace;
      }
      #table {
        width: 100% !important;
      }
      th {
        background: #333;
      }
    </style>
  </head>
  <body>
    <h1>Myrient Explorer (66k Ordner + KB/Bits)</h1>
    <table id="table" class="display">
      <thead>
        <tr>
          <th>Folder</th>
          <th>Size KB (raw)</th>
          <th>Size Bits (raw)</th>
          <th>Files</th>
          <th>URL</th>
          <th>Size GB</th>
          <th>Raw Bytes</th>
        </tr>
      </thead>
    </table>
    <script>
      $(document).ready(function () {
        $("#table").DataTable({
          ajax: { url: "myrient-fixed.json", dataSrc: "" },
          columns: [
            { data: "Folder" },
            { data: "Size_KB", render: (d) => d.toLocaleString() }, // Rohe KB: 377412063883.12
            { data: "Size_Bits", render: (d) => d.toLocaleString() }, // Rohe Bits: 3091759627330560
            { data: "Files", render: (d) => d.toLocaleString() },
            {
              data: "URL",
              render: (v) => `<a href="${v}" target="_blank">Open</a>`,
            },
            { data: "Size_GB", render: (d) => d.toLocaleString() + " GB" }, // GB bleibt Ref
            { data: "recursive_bytes", render: (d) => d.toLocaleString() }, // Rohe Bytes sogar
          ],

          pageLength: 50,
          order: [[1, "desc"]],
          paging: true,
          searching: true,
        });
      });
    </script>
  </body>
</html>
