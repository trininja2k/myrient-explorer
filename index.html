<!doctype html>
<html>
  <head>
    <title>Myrient Explorer</title>
    <link
      rel="stylesheet"
      href="https://cdn.datatables.net/1.13.7/css/jquery.dataTables.min.css"
    />
    <script src="https://code.jquery.com/jquery-3.7.0.js"></script>
    <script src="https://cdn.datatables.net/1.13.7/js/jquery.dataTables.min.js"></script>
    <style>
      body {
        background: #1a1a1a;
        color: #fff;
        font-family: monospace;
        padding: 20px;
        max-width: 1400px;
        margin: auto;
      }
      h1 {
        color: #0ea5e9;
      }
      #status {
        margin: 10px 0;
        padding: 10px;
        background: #2a2a2a;
        border-radius: 5px;
      }
    </style>
  </head>
  <body>
    <h1>🎮 Myrient Explorer (66k folders)</h1>
    <div id="status">Loading JSON...</div>
    <table id="table" class="display" style="width: 100%">
      <thead>
        <tr>
          <th>Folder</th>
          <th>Size</th>
          <th>Files</th>
          <th>URL</th>
        </tr>
      </thead>
    </table>
    <script>
      $(document).ready(function() {
        var table = $('#table').DataTable({
          "ajax": {
            "url": "myrient.json",
            "dataSrc": function (json) {
              return json;  // Array of objects
            }
          },
          "columns": [
            {"data": "Folder"},
            {"data": "Size_GB", "render": function (data) { return data.toLocaleString() + " GB"; }},
            {"data": "Files", "render": function (data) { return data.toLocaleString(); }},
            {"data": "URL", "render": function (data) { return "<a href="" + data + "" target="_blank">Open</a>"; }}
          ],
          "pageLength": 25,
          "order": [[1, "desc"]],
          "drawCallback": function() {
            $("#status").text(table.page.info().recordsTotal + " folders shown");
          }
        });
      });
    </script>
  </body>
</html>
