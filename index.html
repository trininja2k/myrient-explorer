<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Myrient Explorer - trininja2k</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.datatables.net/1.13.7/css/dataTables.bootstrap5.min.css">
  <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
  <script src="https://cdn.datatables.net/1.13.7/js/jquery.dataTables.min.js"></script>
  <script src="https://cdn.datatables.net/1.13.7/js/dataTables.bootstrap5.min.js"></script>
  <script src="https://cdn.datatables.net/buttons/2.4.2/js/dataTables.buttons.min.js"></script>
  <script src="https://cdn.datatables.net/buttons/2.4.2/js/buttons.html5.min.js"></script>
</head>
<body class="bg-dark text-light">
  <div class="container-fluid mt-3">
    <div class="row">
      <div class="col-md-12">
        <h1 class="mb-3">🎮 Myrient Archive Explorer</h1>
        <div id="status" class="alert alert-info">Loading 66k Datasets...</div>
        <table id="myrientTable" class="table table-dark table-striped table-hover" style="width:100%">
          <thead class="table-dark">
            <tr>
              <th>Publisher</th>
              <th>Platform</th>
              <th>Size (GB)</th>
              <th>File Count</th>
            </tr>
          </thead>
        </table>
        <div class="mt-3">
          <small>Source: <a href="https://github.com/prettyprintonline/myrient.org" class="text-info">myrient_folder_breakdown.csv</a> | 
          <a href="https://trininja2k.github.io/myrient-explorer/myrient.json" class="text-info">JSON</a></small>
        </div>
      </div>
    </div>
  </div>
  <script>
  $(document).ready(function() {
    $.getJSON('myrient.json')
      .done(function(data) {
        $('#status').removeClass('alert-info').addClass('alert-success').html(data.length + ' Datasets loaded ✓');
        $('#myrientTable').DataTable({
          data: data,
          pageLength: 50,
          order: [[2, 'desc']],
          columnDefs: [
            { targets: [2,3], className: 'text-end' }
          ],
          dom: '<"row"<"col-sm-12 col-md-6"l><"col-sm-12 col-md-6"f>>' +
               '<"row"<"col-sm-12"tr>>' +
               '<"row"<"col-sm-12 col-md-5"i><"col-sm-12 col-md-7"p>>',
          language: {
            search: 'Suche (MAME, PC Engine...)',
            emptyTable: 'Noch keine Daten geladen'
          },
          drawCallback: function() {
            $('[data-order]').removeClass('active');
          }
        });
      })
      .fail(function(xhr, status, error) {
        $('#status').removeClass('alert-info').addClass('alert-danger').html('JSON Error: ' + error + '<br>Console F12');
        console.error('Load failed:', xhr.responseText);
      });
  });
  </script>
</body>
</html>
