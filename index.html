<!DOCTYPE html>
<html>
<head>
  <title>Myrient Explorer</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.datatables.net/1.13.7/css/dataTables.bootstrap5.min.css">
  <script src="https://code.jquery.com/jquery-3.7.0.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
  <script src="https://cdn.datatables.net/1.13.7/js/jquery.dataTables.min.js"></script>
  <script src="https://cdn.datatables.net/1.13.7/js/dataTables.bootstrap5.min.js"></script>
</head>
<body class="bg-dark text-light">
  <div class="container mt-4">
    <h1>Myrient Archive <span id="loading" class="text-warning">Loading...</span></h1>
    <table id="myrientTable" class="table table-dark table-striped" style="width:100%">
      <thead>
        <tr>
          <th>Publisher</th>
          <th>Platform</th>
          <th>Size (GB)</th>
          <th>Files</th>
        </tr>
      </thead>
    </table>
  </div>
  <script>
  $(document).ready(function() {
    Papa.parse('myrient_folder_breakdown.csv', {
      download: true,
      header: true,
      skipEmptyLines: true,
      complete: function(results) {
        $('#loading').text(results.data.length + ' Datasets loaded');
        if (results.errors.length) console.error('Parse Errors:', results.errors);
        
        $('#myrientTable').DataTable({
          data: results.data,
          columns: [
            { data: 'Publisher', defaultContent: '' },
            { data: 'Platform', defaultContent: '' },
            { data: 'Size_GB', render: data => parseFloat(data || 0).toLocaleString() + ' GB', defaultContent: '0 GB' },
            { data: 'File_Count', render: data => parseInt(data || 0).toLocaleString(), defaultContent: '0' }
          ],
          pageLength: 50,
          order: [[2, 'desc']],
          dom: 'Bfrtip',
          buttons: ['copyHtml5', 'csvHtml5'],
          language: { search: 'Suche Platforms/Publisher...' }
        });
      },
      error: function(err) { $('#loading').text('CSV Error: ' + err); }
    });
  });
  </script>
</body>
</html>
