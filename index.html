<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Myrient Explorer</title>
    <link
      rel="stylesheet"
      href="https://cdn.datatables.net/1.13.7/css/jquery.dataTables.min.css"
    />
    <script src="https://code.jquery.com/jquery-3.7.0.js"></script>
    <script src="https://cdn.datatables.net/1.13.7/js/jquery.dataTables.min.js"></script>
    <style>
      body {
        background: #1a1a1a;
        color: #fff;
        font-family: monospace;
        padding: 20px;
        max-width: 1400px;
        margin: auto;
      }
    </style>
  </head>
  <body>
    <h1>🎮 Myrient Explorer (Folder-Sizes)</h1>
    <div id="status">Loading…</div>
    <table id="table" class="display" style="width: 100%">
      <thead>
        <tr>
          <th>Folder</th>
          <th>Size (GB)</th>
          <th>Files</th>
          <th>URL</th>
        </tr>
      </thead>
    </table>
    <script>
      $(document).ready(function () {
        var table = $("#table").DataTable({
          ajax: {
            url: "myrient.json",
            dataSrc: "", // JSON = Array von Objekten
          },
          columns: [
            { data: "Folder" },
            {
              data: "Size_GB",
              render: (d) => Number(d || 0).toLocaleString() + " GB",
            },
            { data: "Files", render: (d) => Number(d || 0).toLocaleString() },
            {
              data: "URL",
              render: (d) => '<a href="' + d + '" target="_blank">Open</a>',
            },
          ],
          pageLength: 50,
          order: [[1, "desc"]],
          initComplete: function (settings, json) {
            $("#status").text(json.length + " folders loaded");
          },
        });
      });
    </script>
  </body>
</html>
