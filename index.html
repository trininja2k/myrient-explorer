<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Myrient Explorer</title>
  <link rel="stylesheet" href="https://cdn.datatables.net/1.13.7/css/jquery.dataTables.min.css">
  <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
  <script src="https://cdn.datatables.net/1.13.7/js/jquery.dataTables.min.js"></script>
  <style>
    body { background: #1a1a1a; color: #e0e0e0; font-family: 'Courier New', monospace; padding: 20px; }
    h1 { color: #00ff00; text-align: center; margin-bottom: 30px; }
    .container { max-width: 1400px; margin: 0 auto; }
    table.dataTable { width: 100% !important; background: #1e1e1e; }
    table.dataTable thead th { background: #2a2a2a; color: #00ff00; border-bottom: 2px solid #00ff00; padding: 12px; }
    table.dataTable tbody tr { background: #1e1e1e; border-bottom: 1px solid #333; }
    table.dataTable tbody tr:hover { background: #2a2a2a; }
    table.dataTable tbody td { padding: 10px; color: #e0e0e0; }
    td.dt-type-numeric, th.dt-type-numeric { text-align: right !important; }
    a { color: #00aaff; text-decoration: none; }
    a:hover { text-decoration: underline; }
    .dataTables_wrapper .dataTables_filter input { background: #2a2a2a; border: 1px solid #444; color: #e0e0e0; padding: 5px 10px; }
    .dataTables_wrapper .dataTables_length select { background: #2a2a2a; border: 1px solid #444; color: #e0e0e0; padding: 4px 8px; }
  </style>
</head>
<body>
  <div class="container">
    <h1>🎮 Myrient Explorer</h1>
    <table id="myrientTable" class="display">
      <thead>
        <tr>
          <th>Folder</th>
          <th>GB</th>
          <th>Bytes</th>
          <th>KB</th>
          <th>Bits</th>
          <th>Files</th>
          <th>URL</th>
        </tr>
      </thead>
    </table>
  </div>

  <script>
    $(document).ready(function() {
      $('#myrientTable').DataTable({
        ajax: {
          url: 'myrient-final.json',
          dataSrc: ''
        },
        columns: [
          { data: 'Folder' },
          { data: 'GB', className: 'dt-type-numeric' },
          { data: 'Bytes', className: 'dt-type-numeric' },
          { data: 'KB', className: 'dt-type-numeric' },
          { data: 'Bits', className: 'dt-type-numeric' },
          { data: 'Files', className: 'dt-type-numeric' },
          {
            data: 'URL',
            render: function(data, type) {
              if (type === 'display') {
                return '<a href="' + data + '" target="_blank">Open</a>';
              }
              return data;
            },
            orderable: false
          }
        ],
        columnDefs: [{
          targets: [1, 2, 3, 4, 5],
          render: function(data, type) {
            if (type === 'sort' || type === 'type') {
              return parseFloat(data);
            }
            const num = typeof data === 'string' ? parseFloat(data.replace(/,/g, '')) : data;
            return num.toLocaleString('en-US');
          }
        }],
        pageLength: 50,
        order: [[2, 'desc']]
      });
    });
  </script>
</body>
</html>
