<!DOCTYPE html>
<html>
<head>
  <title>Myrient - Perfect Numeric Sort</title>
  <link rel="stylesheet" href="https://cdn.datatables.net/1.13.7/css/jquery.dataTables.min.css">
  <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
  <script src="https://cdn.datatables.net/1.13.7/js/jquery.dataTables.min.js"></script>
  <style>body{background:#1a1a1a;color:#fff;font-family:monospace;padding:20px;}h1{color:#0f0;}th{background:#333;color:#0f0;}</style>
</head>
<body>
<h1>🧮 Myrient Explorer - Numeric Fixed</h1>
<table id="table" class="display">
  <thead>
    <tr>
      <th>Folder</th>
      <th>GB</th>
      <th>KB</th>
      <th>Bits</th>
      <th>Files</th>
      <th>URL</th>
    </tr>
  </thead>
</table>
<script>
// DE Numeric Sort Plugin (999.628 > 23.759 ✓)
$.fn.dataTable.ext.type.order['de-num-pre'] = function(d) {
  return parseFloat(d?.toString().replace(/\./g,'').replace(',','.') || 0);
};

$(document).ready(function(){
  $('#table').DataTable({
    ajax: {url: 'myrient-final.json', dataSrc: ''},
    columns: [
      {data: 'Folder'},
      {data: 'Size_GB'},
      {data: 'Size_KB'},
      {data: 'Size_Bits'},
      {data: 'Files'},
      {data: 'URL', render: v=>`<a href="${v}" target="_blank">Open</a>`}
    ],
    columnDefs: [{targets: [1,2,3,4], type: 'de-num'}],
    pageLength: 50,
    order: [[1, 'desc']]
  });
});
</script>
</body>
</html>
